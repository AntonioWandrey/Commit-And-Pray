services:
  postgres:
    image: postgres:17
    container_name: saude-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-saude_feminina}
      POSTGRES_USER: ${DB_USER:-saude}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saude_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: